name: CI/CD

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build

      - name: Install Playwright Chromium
        run: ./gradlew playwrightInstall

      - name: Start application
        run: |
          nohup ./gradlew bootRun > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8080/api/rooms; then
              exit 0
            fi
            sleep 2
          done

          cat app.log
          exit 1

      - name: Run E2E tests
        run: ./gradlew e2eTest

  deploy-dev:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render DEV
        env:
          RENDER_DEV_DEPLOY_HOOK: ${{ secrets.RENDER_DEV_DEPLOY_HOOK }}
        run: curl --fail --show-error --silent "${RENDER_DEV_DEPLOY_HOOK}&ref=${GITHUB_SHA}"

  deploy-prod:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render PROD
        env:
          RENDER_PROD_DEPLOY_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
        run: curl --fail --show-error --silent "${RENDER_PROD_DEPLOY_HOOK}&ref=${GITHUB_SHA}"